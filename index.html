    <style>
        :root {
            --bg: #fbfbf9;
            --panel: #ffffff;
            --ink: #12141c;
            --muted: #6b7280;
            --hairline: #e7e6e1;
            --cobalt: #2b3ef2;
            --violet: #8b5cf6;
            --gold: #b8863a;
            --gold-soft: #f4ead6;
            --grad-brand: linear-gradient(135deg, #2b3ef2 0%, #8b5cf6 55%, #d18b3a 100%);
            --grad-btn: linear-gradient(135deg, #2b3ef2 0%, #7c3aed 100%);
            --grad-btn-hover: linear-gradient(135deg, #1f2fd6 0%, #6d28d9 100%);
            --grad-gold: linear-gradient(135deg, #b8863a 0%, #e8c988 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            background:
                radial-gradient(1100px 480px at 12% -8%, rgba(43,62,242,0.05), transparent 60%),
                radial-gradient(900px 460px at 100% 0%, rgba(184,134,58,0.06), transparent 55%),
                var(--bg);
            color: var(--ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 4.5rem 1rem 6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ---------- Header ---------- */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            max-width: 640px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1.4rem;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";
            width: 22px;
            height: 1px;
            background: var(--gold);
            opacity: 0.6;
        }

        header h1 {
            font-family: 'Fraunces', serif;
            font-optical-sizing: auto;
            font-size: clamp(3rem, 7vw, 4.6rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            background: var(--grad-brand);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--muted);
            font-size: 1.08rem;
            font-weight: 400;
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ---------- Store grid (Locked to 2 columns) ---------- */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 1180px;
            margin-bottom: 5.5rem;
        }

        .product-card {
            background: var(--panel);
            border: 1px solid var(--hairline);
            border-top: 3px solid transparent;
            background-image: linear-gradient(var(--panel), var(--panel)), var(--grad-brand);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 14px;
            padding: 1.5rem 1.25rem 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(43,62,242,0.25);
            box-shadow: 0 24px 48px -20px rgba(18,20,28,0.16);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ffffff;
            background: var(--grad-btn);
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
        }

        .product-title {
            font-family: 'Fraunces', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .product-meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--hairline);
        }

        .price-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .current-price {
            font-family: 'Fraunces', serif;
            font-size: 1.45rem;
            font-weight: 600;
            margin-left: auto;
            background: var(--grad-gold);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-buy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            background: var(--grad-btn);
            color: #ffffff;
            text-align: center;
            padding: 0.85rem;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.01em;
            box-shadow: 0 10px 24px -10px rgba(43,62,242,0.45);
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-buy:hover {
            background: var(--grad-btn-hover);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px -10px rgba(124,58,237,0.5);
        }

        .btn-buy::after {
            content: "→";
            transition: transform 0.2s ease;
        }

        .btn-buy:hover::after {
            transform: translateX(3px);
        }

        /* ---------- Policy panel ---------- */
        .policy-container {
            width: 100%;
            max-width: 850px;
            background: var(--panel);
            border: 1px solid var(--hairline);
            border-top: 3px solid transparent;
            background-image: linear-gradient(var(--panel), var(--panel)), var(--grad-brand);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 18px;
            padding: 3.5rem;
            box-shadow: 0 30px 60px -30px rgba(18,20,28,0.12);
        }

        .policy-container > .eyebrow {
            margin-bottom: 0.5rem;
        }

        .policy-container h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.45rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--ink);
            padding-bottom: 0.75rem;
            position: relative;
        }

        .policy-container h2::after {
            content: "";
            display: block;
            margin-top: 0.75rem;
            width: 56px;
            height: 3px;
            border-radius: 999px;
            background: var(--grad-brand);
        }

        .policy-container h2:not(:first-of-type) {
            margin-top: 2.75rem;
        }

        .policy-container h3 {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink);
            margin-top: 1.75rem;
            margin-bottom: 0.6rem;
        }

        .policy-container p {
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.75;
            margin-bottom: 1rem;
        }

        .policy-container ul {
            font-size: 0.92rem;
            color: var(--muted);
            line-height: 1.75;
            margin-bottom: 1.5rem;
            padding-left: 1.4rem;
        }

        .policy-container li {
            margin-bottom: 0.4rem;
        }

        .policy-container li::marker {
            color: var(--gold);
        }

        .policy-container a {
            color: var(--cobalt);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid rgba(43,62,242,0.3);
        }

        .policy-container a:hover {
            border-bottom-color: var(--cobalt);
        }

        /* Desktop spacing adjustments */
        @media (min-width: 769px) {
            .store-grid { gap: 1.75rem; }
            .product-card { padding: 2rem 2rem 1.75rem; }
            .product-title { font-size: 1.4rem; }
            .product-meta { font-size: 0.92rem; }
        }

        @media (max-width: 600px) {
            .policy-container { padding: 2.2rem 1.5rem; }
        }
    </style>
