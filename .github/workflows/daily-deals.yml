name: Daily Amazon Deals Update Tracker

on:
  schedule:
    - cron: '0 4 * * *' 
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios

      - name: Execute Live Scraper & Inject Tags
        run: node update_deals.js

      - name: Commit and Push Changes to Main
        run: |
          git config --global user.name "Antify Automation Bot"
          git config --global user.email "bot@antify.local"
          git add index.html
          git commit -m "Auto-update: Refreshing daily deals catalog [skip ci]" || exit 0
          git push
